name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch first so pip does not pull the large CUDA wheel.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,ml,eval]"

      - name: Run pytest
        run: pytest

      - name: Build synthetic benchmark dataset (end-to-end data pipeline)
        run: >
          python -m dsdbench.data.pipeline
          --synthetic-fallback
          --out-dir build/bench-data
          --n-scenes 6 --agents-per-scene 8 --duration-s 24

      - name: Build and run C++ tests
        run: |
          cmake -S . -B build -DDSD_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 2
          ctest --test-dir build --output-on-failure
