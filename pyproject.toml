[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "dsdbench"
version = "0.1.0"
description = "Benchmark for ML discriminators separating real logged driving trajectories from simulated ones"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=14",
    "duckdb>=0.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-benchmark>=4",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]
nuscenes = [
    "nuscenes-devkit>=1.1.9",
]
ml = [
    "lightgbm>=4.1",
    "shap>=0.44",
    "scikit-learn>=1.4",
    "torch>=2.2",
]
eval = [
    "joblib>=1.3",
    "matplotlib>=3.8",
]

[tool.scikit-build]
minimum-version = "0.9"
cmake.version = ">=3.22"
cmake.build-type = "Release"
wheel.packages = ["dsdbench"]
sdist.include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# numpy>=2.4 stubs use PEP 695 `type` statements, which mypy only parses at
# python_version >= 3.12. The code itself remains Python 3.11 compatible.
python_version = "3.12"
files = ["dsdbench"]
strict = true
# nn.Module subclasses are Any when torch's stubs are unavailable (e.g. in the
# pre-commit hook environment); strict's subclassing check is relaxed for that.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = [
    "scipy",
    "scipy.*",
    "yaml",
    "nuscenes",
    "nuscenes.*",
    "pyarrow",
    "pyarrow.*",
    "torch",
    "torch.*",
    "lightgbm",
    "shap",
    "sklearn",
    "sklearn.*",
    "joblib",
    "matplotlib",
    "matplotlib.*",
]
ignore_missing_imports = true
