# Rule-based maneuver labeling thresholds. See the ManeuverLabeler docstring in
# dsdbench/data/maneuver_labels.py for a full description of each parameter.

stop_and_go:
  stop_speed_ms: 0.5
  min_speed_range_ms: 5.0

unprotected_left:
  min_heading_change_rad: 1.0
  min_mean_speed_ms: 1.0

lateral_shift:  # shared by cut_in and merge
  min_lateral_m: 1.6
  max_heading_change_rad: 0.6
  edge_fraction: 0.25
